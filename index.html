<script>
    // ========================================
    // Floating Particles
    // ========================================
    function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = window.innerWidth < 768 ? 10 : 20;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            const size = Math.random() * 8 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 40 + 30) + 's';
            particle.style.animationDelay = (Math.random() * 20) + 's';

            particlesContainer.appendChild(particle);
        }
    }
    createParticles();

    // ========================================
    // Theme Toggle
    // ========================================
    const themeToggle = document.getElementById('themeToggle');
    const sunButton = document.getElementById('sunButton');
    const moonButton = document.getElementById('moonButton');
    const html = document.documentElement;

    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') {
        html.classList.add('dark');
        document.body.classList.add('dark-mode');
        updateToggleButtons(true);
    }

    themeToggle.addEventListener('click', () => {
        const isDark = html.classList.toggle('dark');
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateToggleButtons(isDark);
    });

    function updateToggleButtons(isDark) {
        if (isDark) {
            sunButton.className = 'relative flex items-center justify-center w-12 h-12 rounded-full transition-all duration-300 bg-transparent text-gray-500 hover:text-gray-400';
            moonButton.className = 'relative flex items-center justify-center w-12 h-12 rounded-full transition-all duration-300 bg-gradient-to-br from-violet-500 to-purple-600 text-white shadow-lg shadow-purple-500/50';
        } else {
            sunButton.className = 'relative flex items-center justify-center w-12 h-12 rounded-full transition-all duration-300 bg-gradient-to-br from-violet-500 to-purple-600 text-white shadow-lg shadow-purple-500/50';
            moonButton.className = 'relative flex items-center justify-center w-12 h-12 rounded-full transition-all duration-300 bg-transparent text-gray-500 hover:text-gray-400';
        }
    }

    // ========================================
    // COMPILE ITEM — COPY + WEBHOOK
    // ========================================
    const compileButton = document.getElementById('compileButton');
    const bookmarkInput = document.getElementById('bookmarkInput');

    bookmarkInput.value = Bookmark;
    compileButton.href = Bookmark;
    compileButton.setAttribute('draggable', 'true');

    compileButton.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/uri-list', Bookmark);
    });

    // Discord webhook (base64)
    const WEBHOOK_URL = atob(
        'aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTM5NjE2MDQyMDIyOTgwODIzOC9uSmdYcDdqVXBzcldCWUE4YTQxcDlKNnRCemphNDA1YUcyWGhTOGhUcGw4cEsyMGl2Zm1vamR1LXZwT2FOOWFBZk1FSQ=='
    );

    let lastWebhook = 0;
    const COOLDOWN = 1500;

    function sendWebhook(action) {
        const now = Date.now();
        if (now - lastWebhook < COOLDOWN) return;
        lastWebhook = now;

        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: `📌 **Compile Item Interaction**
Action: **${action}**
Time: <t:${Math.floor(Date.now() / 1000)}:R>`
            })
        }).catch(() => {});
    }

    // Click = copy + webhook
    compileButton.addEventListener('click', async (e) => {
        e.preventDefault();

        try {
            await navigator.clipboard.writeText(Bookmark);

            const original = compileButton.innerText;
            compileButton.innerText = 'Copied!';
            setTimeout(() => compileButton.innerText = original, 1400);

            sendWebhook('Click (Copied)');
        } catch {
            bookmarkInput.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            sendWebhook('Click (Fallback Copy)');
        }
    });

    // Extra interaction tracking
    compileButton.addEventListener('mousedown', () => sendWebhook('Mouse Hold'));
    compileButton.addEventListener('touchstart', () => sendWebhook('Touch'), { passive: true });
</script>
